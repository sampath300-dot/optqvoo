<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>OPTQVO — Find your next opportunity</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="OPTQVO Jobs — curated internships, graduate programmes and early-career engineering roles with direct application links.">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('optqvo-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#08080d' : '#ffffff');
        } catch (e) { /* ignore */ }
      })();
    </script>
    <style>
      /* first-paint splash: inline so it shows before any stylesheet or JS loads */
      #optqvo-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #ffffff; transition: opacity .45s ease;
      }
      #optqvo-splash img { display: block; width: 64px; height: 64px; }
      #optqvo-splash span {
        font: 800 15px/1 'Inter', Arial, sans-serif;
        letter-spacing: .18em; text-transform: uppercase; color: #6d3bf5;
      }
      #optqvo-splash.is-hidden { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #optqvo-splash { transition: none; } }
      html { background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="optqvo-splash" role="status" aria-label="Loading OPTQVO">
      <img src="logo-brand.png" alt="" width="64" height="64">
      <span>OPTQVO</span>
    </div>
    <app-root></app-root>
  </body>
</html>
